<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALUNA COLOMBIA · Arquitectura del Silencio</title>
  <meta name="description" content="Expertos en ventanas termoacústicas, vidrio templado y carpintería de aluminio y acero. Aíslate del ruido con soluciones a medida." />

  <!-- Open Graph -->
  <meta property="og:title" content="ALUNA COLOMBIA · Arquitectura del Silencio" />
  <meta property="og:description" content="Transformamos espacios ruidosos en ambientes de paz y confort." />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#121212;               /* negro carbón */
      --panel: rgba(255,255,255,.06);
      --panel2: rgba(255,255,255,.09);
      --stroke: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.72);
      --muted2: rgba(255,255,255,.58);

      /* “vívidos e intensos” (ajústalos a tu marca si tienes colores exactos) */
      --accent:#00E6A8; /* verde menta */
      --accent2:#4B7CFF; /* azul eléctrico */
      --accent3:#FF2D55; /* rosa/rojo */
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --shadow2: 0 10px 30px rgba(0,0,0,.35);

      --radius: 18px;
      --radius2: 26px;

      --max: 1120px;

      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }

    *{ box-sizing: border-box; }
    html,body{ height: 100%; }
    body{
      margin:0;
      font-family: var(--font);
      background:
        radial-gradient(1200px 650px at 15% 10%, rgba(0,230,168,.14), transparent 52%),
        radial-gradient(900px 520px at 85% 20%, rgba(75,124,255,.16), transparent 50%),
        radial-gradient(1000px 650px at 55% 85%, rgba(255,45,85,.10), transparent 55%),
        var(--bg);
      color: var(--text);
      overflow-x:hidden;
    }

    a{ color: inherit; text-decoration: none; }
    button, input, select, textarea{ font-family: inherit; }
    .container{ width: min(var(--max), calc(100% - 40px)); margin: 0 auto; }

    /* ---------------- Header ---------------- */
    .header{
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(18,18,18,.58);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.10);
    }
    .header .row{
      display:flex;
      align-items:center;
      justify-content: space-between;
      padding: 14px 0;
      gap: 14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap: 12px;
      min-width: 260px;
    }
    .logo{
      width: 42px; height: 42px;
      border-radius: 14px;
      background:
        radial-gradient(10px 10px at 30% 30%, rgba(255,255,255,.35), transparent 55%),
        linear-gradient(135deg, rgba(0,230,168,.95), rgba(75,124,255,.9));
      box-shadow: 0 10px 35px rgba(0,230,168,.15);
      border: 1px solid rgba(255,255,255,.18);
      position: relative;
      overflow:hidden;
    }
    .logo:after{
      content:"";
      position:absolute; inset:-40px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
      transform: rotate(20deg);
      animation: sheen 6s infinite linear;
    }
    @keyframes sheen{
      0%{ transform: translateX(-40%) rotate(20deg); opacity: .0;}
      20%{ opacity:.9;}
      60%{ opacity:.35;}
      100%{ transform: translateX(40%) rotate(20deg); opacity: 0;}
    }

    .brand h1{
      margin:0;
      font-size: 14px;
      letter-spacing: .08em;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .brand p{
      margin: 3px 0 0;
      font-size: 12.5px;
      color: var(--muted);
      letter-spacing: .02em;
    }

    nav{
      display:flex;
      gap: 18px;
      align-items:center;
      justify-content:flex-end;
    }
    nav a{
      font-size: 13px;
      color: var(--muted);
      padding: 10px 10px;
      border-radius: 12px;
      transition: .2s ease;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    nav a:hover{
      color: var(--text);
      background: rgba(255,255,255,.06);
      border-color: rgba(255,255,255,.12);
    }

    /* CTA flotante */
    .floating-wa{
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 80;
      display:flex;
      gap: 10px;
      align-items:center;
    }
    .pill{
      display:none;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.14);
      color: var(--muted);
      font-size: 12px;
      box-shadow: var(--shadow2);
    }
    @media (min-width: 920px){
      .pill{ display:block; }
    }

    .wa-btn{
      width: 56px; height: 56px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.16);
      background:
        radial-gradient(14px 14px at 30% 20%, rgba(255,255,255,.25), transparent 60%),
        linear-gradient(135deg, rgba(0,230,168,.95), rgba(0,230,168,.35));
      box-shadow: 0 18px 55px rgba(0,230,168,.22);
      display:grid;
      place-items:center;
      transition: transform .2s ease, filter .2s ease;
    }
    .wa-btn:hover{ transform: translateY(-2px); filter: saturate(1.1); }
    .wa-btn svg{ width: 26px; height: 26px; fill: #06130F; }

    /* ---------------- Hero ---------------- */
    .hero{
      padding: 34px 0 14px;
    }

    .hero-grid{
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 22px;
      align-items: start;
    }
    @media (max-width: 980px){
      .hero-grid{ grid-template-columns: 1fr; }
    }

    .hero-card{
      border-radius: var(--radius2);
      border: 1px solid rgba(255,255,255,.12);
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow: var(--shadow);
      overflow:hidden;
      position: relative;
    }
    .hero-card:before{
      content:"";
      position:absolute; inset: -2px;
      background:
        radial-gradient(600px 300px at 20% 0%, rgba(0,230,168,.20), transparent 55%),
        radial-gradient(450px 240px at 75% 20%, rgba(75,124,255,.20), transparent 55%),
        radial-gradient(450px 260px at 60% 100%, rgba(255,45,85,.12), transparent 55%);
      pointer-events:none;
      opacity:.9;
    }
    .hero-inner{
      position: relative;
      padding: 26px 22px 18px;
    }

    .kicker{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
      margin-bottom: 10px;
    }
    .tag{
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--muted);
    }
    .tag strong{ color: var(--text); }

    .hero h2{
      margin: 12px 0 10px;
      font-size: clamp(26px, 3.2vw, 40px);
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .hero p{
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 15.5px;
      line-height: 1.6;
      max-width: 62ch;
    }

    .cta-row{
      display:flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
      align-items:center;
    }
    .btn{
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-weight: 650;
      font-size: 14px;
      transition: .2s ease;
      display:inline-flex;
      align-items:center;
      gap: 10px;
    }
    .btn:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.22);
      background: rgba(255,255,255,.09);
    }
    .btn-primary{
      background:
        radial-gradient(14px 14px at 20% 30%, rgba(255,255,255,.25), transparent 60%),
        linear-gradient(135deg, rgba(0,230,168,.95), rgba(75,124,255,.70));
      border-color: rgba(255,255,255,.18);
      color: #06130F;
      box-shadow: 0 18px 55px rgba(0,230,168,.16);
    }
    .btn-primary:hover{ filter:saturate(1.1); }
    .btn svg{ width: 18px; height: 18px; fill: currentColor; opacity: .95; }

    /* Valor */
    .value-bar{
      margin-top: 16px;
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 12px;
    }
    @media (max-width: 720px){
      .value-bar{ grid-template-columns: 1fr; }
    }
    .value{
      padding: 14px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
    }
    .value .num{
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text);
      display:flex; align-items:center; gap: 8px;
      margin-bottom: 6px;
    }
    .dot{
      width: 10px; height: 10px; border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(0,230,168,.15);
    }
    .value:nth-child(2) .dot{ background: var(--accent2); box-shadow: 0 0 0 6px rgba(75,124,255,.18);}
    .value:nth-child(3) .dot{ background: var(--accent3); box-shadow: 0 0 0 6px rgba(255,45,85,.16);}
    .value .txt{
      color: var(--muted);
      font-size: 13.5px;
      line-height:1.35;
    }

    /* Carrusel infinito */
    .projects-card{
      border-radius: var(--radius2
